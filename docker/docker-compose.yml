# Run from the repo root:  docker compose -f docker/docker-compose.yml up --build
# Train first (python -m src.pipeline ...) so ./artifacts/bundle.joblib exists.
services:
  api:
    build: { context: .., dockerfile: docker/Dockerfile.api }
    ports: ["8000:8000"]
    volumes: ["../artifacts:/artifacts:ro"]
  dashboard:
    build: { context: .., dockerfile: docker/Dockerfile.dashboard }
    ports: ["8501:8501"]
    volumes: ["../artifacts:/artifacts:ro", "../data:/data:ro"]
