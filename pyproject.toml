[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "court-case-forecast"
version = "0.1.0"
description = "Survival-analysis forecasting of court case duration with calibrated uncertainty"
requires-python = ">=3.11"
dependencies = [
  "polars", "duckdb", "pandas", "pyarrow", "numpy", "scikit-learn", "scikit-survival", "lifelines",
  "joblib", "simpy", "fastapi", "uvicorn[standard]", "pydantic>=2", "streamlit",
]

[project.optional-dependencies]
deep = ["torch", "pycox"]
tracking = ["mlflow"]
conformal = ["mapie"]
dev = ["pytest", "httpx", "ruff"]

[project.scripts]
ccf-pipeline = "src.pipeline:main_cli"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
